<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prowpp — Acceso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo .icon { font-size: 2.5rem; }
    .logo h1 { font-size: 1.8rem; font-weight: 800; color: #0f0c29; margin-top: 8px; }
    .logo p { color: #6b7280; font-size: 0.9rem; margin-top: 4px; }

    label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    input:focus { border-color: #302b63; }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #302b63, #24243e);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .error {
      background: #fee2e2;
      color: #b91c1c;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .footer { text-align: center; margin-top: 24px; font-size: 0.8rem; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="icon">⚡</div>
      <h1>Prowpp</h1>
      <p>Gestión de equipos vía WhatsApp</p>
    </div>
    <div id="error" class="error" style="display:none">Email o contraseña incorrectos</div>
    <form method="POST" action="/login">
      <label>Email</label>
      <input type="email" name="email" placeholder="tu@email.com" required autofocus>
      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <button type="submit">Entrar →</button>
    </form>
    <div class="footer">prowpp.com · Gestión inteligente de equipos</div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
