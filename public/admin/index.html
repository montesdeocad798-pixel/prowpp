<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prowpp — Super Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; }

    header {
      background: linear-gradient(135deg, #0f0c29, #302b63);
      color: white; padding: 16px 28px;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header .badge-admin { background: #fbbf24; color: #1a1a2e; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; margin-left: 8px; }
    header .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
    .logout { padding: 6px 14px; background: rgba(255,255,255,0.15); border: none; color: white; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }

    nav { background: white; border-bottom: 1px solid #e5e7eb; display: flex; padding: 0 28px; }
    .nav-btn { padding: 14px 20px; border: none; background: none; cursor: pointer; font-size: 0.875rem; font-weight: 500; color: #6b7280; border-bottom: 2px solid transparent; }
    .nav-btn.active { color: #302b63; border-bottom-color: #302b63; font-weight: 700; }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
    section { display: none; }
    section.active { display: block; }

    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .stat { background: white; border-radius: 12px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); text-align: center; }
    .stat .num { font-size: 2.2rem; font-weight: 800; color: #302b63; }
    .stat .lbl { font-size: 0.75rem; color: #6b7280; margin-top: 4px; }

    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 20px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th { text-align: left; padding: 10px 14px; font-weight: 600; color: #6b7280; border-bottom: 2px solid #f3f4f6; font-size: 0.78rem; text-transform: uppercase; }
    td { padding: 13px 14px; border-bottom: 1px solid #f3f4f6; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .plan-badge { padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .plan-basico { background: #f3f4f6; color: #6b7280; }
    .plan-pro { background: #ede9fe; color: #6d28d9; }
    .activo-badge { background: #dcfce7; color: #15803d; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; }

    /* Modal nueva empresa */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 480px; }
    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .field input { width: 100%; padding: 10px 14px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 0.9rem; outline: none; }
    .field input:focus { border-color: #302b63; }
    .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
    .btn-primary { flex: 1; padding: 12px; background: #302b63; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .btn-secondary { padding: 12px 20px; background: #f3f4f6; color: #374151; border: none; border-radius: 8px; cursor: pointer; }
    .btn-new { padding: 10px 20px; background: #302b63; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.875rem; }
    .empty { text-align: center; padding: 32px; color: #9ca3af; }
    .success { background: #dcfce7; color: #15803d; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.875rem; display: none; }
  </style>
</head>
<body>

<header>
  <div>⚡</div>
  <div>
    <h1>Prowpp <span class="badge-admin">SUPER ADMIN</span></h1>
  </div>
  <div class="right">
    <span style="font-size:0.85rem;opacity:0.7">David Montesdeoca</span>
    <button class="logout" onclick="location.href='/logout'">Salir</button>
  </div>
</header>

<nav>
  <button class="nav-btn active" onclick="showTab('empresas', this)">🏢 Empresas</button>
  <button class="nav-btn" onclick="showTab('usuarios', this)">👤 Jefes</button>
</nav>

<div class="container">

  <!-- EMPRESAS -->
  <section id="tab-empresas" class="active">
    <div class="stats" id="stats-admin"></div>
    <div class="card">
      <h2 style="display:flex;align-items:center;justify-content:space-between">
        🏢 Empresas cliente
        <button class="btn-new" onclick="document.getElementById('modal').classList.add('open')">+ Nueva empresa</button>
      </h2>
      <div id="success-msg" class="success">✅ Empresa creada correctamente</div>
      <div id="tabla-empresas"><p class="empty">Cargando...</p></div>
    </div>
  </section>

  <!-- USUARIOS/JEFES -->
  <section id="tab-usuarios">
    <div class="card">
      <h2>👤 Jefes de empresa</h2>
      <div id="tabla-usuarios"><p class="empty">Cargando...</p></div>
    </div>
  </section>

</div>

<!-- MODAL NUEVA EMPRESA -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>➕ Nueva empresa cliente</h3>
    <div class="field"><label>Nombre de la empresa</label><input id="f-empresa" placeholder="Ej: Reformas García SL"></div>
    <div class="field"><label>Sector</label><input id="f-sector" placeholder="Ej: Electricidad, Fontanería..."></div>
    <hr style="margin:16px 0;border-color:#f3f4f6">
    <p style="font-size:0.82rem;font-weight:700;color:#374151;margin-bottom:16px">Datos de acceso del jefe</p>
    <div class="field"><label>Nombre del jefe</label><input id="f-jefe-nombre" placeholder="Nombre completo"></div>
    <div class="field"><label>Email</label><input id="f-jefe-email" type="email" placeholder="jefe@empresa.com"></div>
    <div class="field"><label>Contraseña</label><input id="f-jefe-pass" type="password" placeholder="Mínimo 6 caracteres"></div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="document.getElementById('modal').classList.remove('open')">Cancelar</button>
      <button class="btn-primary" onclick="crearEmpresa()">Crear empresa →</button>
    </div>
  </div>
</div>

<script>
  function showTab(name, btn) {
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'usuarios') cargarUsuarios();
  }

  async function cargarStats() {
    const res = await fetch('/api/admin/stats');
    const data = await res.json();
    document.getElementById('stats-admin').innerHTML = `
      <div class="stat"><div class="num">${data.totalEmpresas}</div><div class="lbl">Empresas activas</div></div>
      <div class="stat"><div class="num">${data.totalJefes}</div><div class="lbl">Jefes registrados</div></div>
      <div class="stat"><div class="num" style="color:#15803d">€${(data.totalEmpresas * 49).toLocaleString()}</div><div class="lbl">Ingresos/mes est.</div></div>
    `;
  }

  async function cargarEmpresas() {
    const res = await fetch('/api/admin/companies');
    const data = await res.json();
    const el = document.getElementById('tabla-empresas');
    if (!data.length) { el.innerHTML = '<p class="empty">No hay empresas aún. Crea la primera.</p>'; return; }
    el.innerHTML = `<table><thead><tr><th>Empresa</th><th>Sector</th><th>Trabajadores</th><th>Plan</th><th>Estado</th></tr></thead><tbody>
      ${data.map(c => `<tr>
        <td><strong>${c.nombre}</strong></td>
        <td>${c.sector}</td>
        <td>${c.totalWorkers}</td>
        <td><span class="plan-badge plan-${c.plan}">${c.plan}</span></td>
        <td><span class="activo-badge">✅ Activo</span></td>
      </tr>`).join('')}
    </tbody></table>`;
  }

  async function cargarUsuarios() {
    const res = await fetch('/api/admin/users');
    const data = await res.json();
    const el = document.getElementById('tabla-usuarios');
    if (!data.length) { el.innerHTML = '<p class="empty">No hay jefes registrados.</p>'; return; }
    el.innerHTML = `<table><thead><tr><th>Nombre</th><th>Email</th><th>Empresa</th></tr></thead><tbody>
      ${data.map(u => `<tr>
        <td><strong>${u.nombre}</strong></td>
        <td>${u.email}</td>
        <td>${u.empresa}</td>
      </tr>`).join('')}
    </tbody></table>`;
  }

  async function crearEmpresa() {
    const body = {
      nombre: document.getElementById('f-empresa').value.trim(),
      sector: document.getElementById('f-sector').value.trim(),
      jefeNombre: document.getElementById('f-jefe-nombre').value.trim(),
      jefeEmail: document.getElementById('f-jefe-email').value.trim(),
      jefePassword: document.getElementById('f-jefe-pass').value.trim(),
    };
    if (!body.nombre || !body.jefeEmail || !body.jefePassword) return alert('Rellena todos los campos');
    await fetch('/api/admin/companies', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    document.getElementById('modal').classList.remove('open');
    ['f-empresa','f-sector','f-jefe-nombre','f-jefe-email','f-jefe-pass'].forEach(id => document.getElementById(id).value = '');
    const msg = document.getElementById('success-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 4000);
    cargarEmpresas();
    cargarStats();
  }

  cargarStats();
  cargarEmpresas();
</script>
</body>
</html>
